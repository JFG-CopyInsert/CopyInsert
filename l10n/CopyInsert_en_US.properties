# CopyInsert - texts of the macros (default language: English, US)
#
# One line per text: key=value. Rules for translators (see README.txt):
#  - Do not change the keys (the part before the "=").
#  - Keep the "~": the letter after it is the keyboard letter of the menu entry.
#    Inside one submenu the letters must be different.
#  - Write every accented or special character as \uXXXX (the file is read as ASCII).
#  - Keep a trailing space written as \u0020 (see undo.prefix).
#  - A key missing from a translated file is shown in English.


# menu entries (parents of the submenus)
m.copy.cells=Copy cells and insert
m.paste.cells=Copy cells and paste special
m.cut.cells=Cut cells and insert
