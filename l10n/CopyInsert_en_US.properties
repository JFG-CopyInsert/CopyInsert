# messages
msg.select=Please select a single range, row(s) or column(s) first.
msg.nosheets=Please select the sheet(s) to copy first.
msg.sheetgap=The selected sheets must be consecutive. Select a continuous range of sheet tabs (Shift+click) and try again.
msg.sheetinside=The sheets cannot be inserted inside the range of the selected sheets: the references between them would be broken. Choose a destination before the first selected sheet or after the last one.
msg.wholesheet=The whole sheet cannot be used as a source.
msg.multi=Several selected ranges must all be complete rows, or all be complete columns.
msg.point1=Please point to a cell in the destination.
msg.point2=Click directly on a cell in the sheet (not on the buttons of the small window).
msg.point3=To cancel, close the small window.
msg.noreopen=The destination prompt could not be reopened. Please choose the menu entry again.
msg.pastefail=Paste Special could not be opened. The copied cells are on the clipboard: select the new empty area and choose Edit > Paste Special.
msg.inside=The destination lies inside the source selection. Operation cancelled.

