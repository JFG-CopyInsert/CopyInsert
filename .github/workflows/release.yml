# Builds the CopyInsert .oxt and attaches it to a GitHub release whenever a version tag
# (v1.2.1, v1.3.0 ...) is pushed. If a release with that tag already exists (created by
# hand on the GitHub website), the .oxt is simply added to it.
#
# Before tagging: the version in description.xml must be the tag without the "v".
# The file is named like the previous releases: CopyInsert-1_2_1.oxt

name: Build and release the extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write        # needed to create the release and attach the file

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Work out the version and the file name from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "OXT=CopyInsert-${VERSION//./_}.oxt" >> "$GITHUB_ENV"

      - name: Check that the files are valid and the version matches the tag
        run: |
          python3 - <<'EOF'
          import glob, os, sys, xml.dom.minidom
          files = ["description.xml", "META-INF/manifest.xml"]
          for pattern in ("registry/*.xcu", "CopyInsertLib/*.xba", "CopyInsertLib/*.xlb"):
              files += glob.glob(pattern)
          for name in files:
              try:
                  xml.dom.minidom.parse(name)
              except Exception as error:
                  sys.exit("%s is not valid XML: %s" % (name, error))
          dom = xml.dom.minidom.parse("description.xml")
          declared = dom.getElementsByTagName("version")[0].getAttribute("value")
          expected = os.environ["VERSION"]
          if declared != expected:
              sys.exit("description.xml says version %s but the tag says %s" % (declared, expected))
          print("OK: %d XML files are valid, version %s" % (len(files), declared))
          EOF

      - name: Build the .oxt
        run: |
          zip -r -X "$OXT" META-INF description.xml description l10n license python registry CopyInsertLib \
            -x "*__pycache__*" "*.pyc"
          unzip -l "$OXT"
          unzip -l "$OXT" | grep -q " META-INF/manifest.xml$"

      - name: Create the release and attach the .oxt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # the release was already created by hand on the GitHub website: just add the file
            gh release upload "$GITHUB_REF_NAME" "$OXT" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$OXT" \
              --title "CopyInsert $VERSION" \
              --generate-notes
          fi
